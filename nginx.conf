# cocido's site: the static files of `astro build`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Each page is a folder with its index.html: /principles/ and /principles both find it.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Astro's assets carry a hash in their name: they never change, so they are kept for a year.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /404.html;
}
